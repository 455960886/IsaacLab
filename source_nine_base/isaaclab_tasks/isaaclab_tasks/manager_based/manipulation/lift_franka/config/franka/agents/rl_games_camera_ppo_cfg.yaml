params:
  seed: 42

  # === Environment Wrappers ===
  env:
    clip_observations: 300
    clip_actions: 300

  # === Algorithm ===
  algo:
    name: a2c_continuous  # A2C base, PPO=True -> PPO used

  # === Use Custom Model ===
  model:
    name: continuous_a2c_logstd  # your custom ModelA2C subclass
  # config.yaml 关键部分
  separate: False
  network:
    name: actor_critic
      # 必须与注册名称完全一致
    input_shape: [128, 128, 3]  # 根据你的实际观察空间调整
    actions_num: 8
    
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
          scale: 0.02
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True

    cnn:
      type: conv2d
      input_shape: [128, 128, 3]  # 你可以根据实际输入调整 HWC
      permute_input: true       # 转为 CHW 格式
      initializer:
        name: orthogonal
        gain: 1.0
      activation: relu
      convs:
        - filters: 32
          kernel_size: 8
          strides: 4
          padding: 0
        - filters: 64
          kernel_size: 4
          strides: 2
          padding: 0
        - filters: 64
          kernel_size: 3
          strides: 1
          padding: 0
      flatten: true

      # mlp:
      #   units: [256]
      #   activation: relu
      #   initializer:
      #     name: orthogonal
      #     gain: 1.0

    mlp1:
      units: [512]
      activation: relu
      initializer:
        name: orthogonal_initializer
      regularizer:
        name: None #'l2_regularizer'
        #scale: 0.001        # 根据你的动作空间调整
  # 其他网络参数...
    mlp2:
      units: [512]
      activation: relu
      initializer:
        name: orthogonal_initializer
      regularizer:
        name: None
    
  load_checkpoint: False
  load_path: ''

  # === Core PPO Config ===
  config:
    name: franka_lift
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: True
    ppo: True
    mixed_precision: False

    normalize_input: False
    normalize_value: True
    normalize_advantage: True

    gamma: 0.99
    tau: 0.95

    learning_rate: 3e-4
    lr_schedule: adaptive
    kl_threshold: 0.008

    reward_shaper:
      scale_value: 1.0

    grad_norm: 1.0
    entropy_coef: 0.0
    critic_coef: 2.0
    e_clip: 0.2
    clip_value: True
    truncate_grads: True

    horizon_length: 64
    minibatch_size: 256
    mini_epochs: 4
    seq_length: 4

    bounds_loss_coef: 0.0001

    num_actors: -1

    max_epochs: 100000
    save_best_after: 50
    save_frequency: 100
    score_to_win: 20000
